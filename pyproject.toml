[project]
name = "agentguard"
version = "0.2.0"
description = "Pre-signing risk engine for AI-agent payments (research prototype)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "cryptography", "fastapi", "uvicorn", "streamlit", "pandas", "openpyxl>=3.1.5", "eth-account"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
